<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 반 보드게임 대여소</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.js"></script>
<style>
  :root {
    --bg: #f6f7f4;
    --card: #ffffff;
    --ink: #1f2a24;
    --muted: #66706a;
    --line: #e3e6e0;
    --accent: #2f7d5b;
    --accent-soft: #e5f2eb;
    --accent-ink: #1e5a40;
    --warn: #b4472f;
    --warn-soft: #fbeae5;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.5;
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: 20px 16px;
  }
  header .inner, main { max-width: 1080px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 1.4rem; }
  header p { margin: 4px 0 0; opacity: .85; font-size: .95rem; }
  main { padding: 16px; display: grid; gap: 16px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
  }
  .card h2 { margin: 0 0 14px; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
  .card h2 .num {
    display: inline-grid; place-items: center;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent-ink); font-size: .85rem;
  }

  /* 폼 스타일 */
  .grid-form { display: grid; grid-template-columns: 2fr 1fr 1.2fr 1fr; gap: 12px; }
  .grid-form .full { grid-column: 1 / -1; }
  label { display: block; font-size: .88rem; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  label .req { color: var(--warn); }
  input, select {
    width: 100%; padding: 10px 12px; font: inherit;
    border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink);
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }

  button {
    font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); padding: 10px 14px;
  }
  button:hover { background: #f1f3ef; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  button.primary:hover { background: var(--accent-ink); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button.return-btn { color: var(--accent-ink); border-color: #b7dcc9; background: var(--accent-soft); padding: 8px 14px; font-size: .9rem; font-weight: 700; }
  button.return-btn:hover { background: #d2ebd9; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; }

  /* 보드게임 현황 그리드 */
  .game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .game-card {
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
    transition: border-color .15s, transform .1s;
    cursor: pointer;
    background: #fff;
  }
  .game-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .game-card.soldout { opacity: .65; background: #f7f8f6; cursor: default; transform: none; }
  .game-card.soldout:hover { border-color: var(--line); }
  .game-title { font-weight: 700; font-size: 1.05rem; margin: 0; }
  .game-meta { font-size: .85rem; color: var(--muted); }
  .badge {
    display: inline-block; padding: 4px 10px; border-radius: 99px;
    font-size: .82rem; font-weight: 700; width: fit-content;
  }
  .badge.ok { background: var(--accent-soft); color: var(--accent-ink); }
  .badge.no { background: #eceee9; color: var(--muted); }

  /* 대여 목록 */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .toolbar .spacer { flex: 1; }
  .check { display: flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted); cursor: pointer; }
  .check input { width: auto; }
  .list { display: grid; gap: 8px; }
  .item {
    display: grid; grid-template-columns: 160px 1fr 140px auto; gap: 12px; align-items: center;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px;
  }
  .item .game-name { font-weight: 700; color: var(--accent-ink); }
  .item .who { font-weight: 600; }
  .item .time { font-size: .85rem; color: var(--muted); }
  .item.returned { opacity: .6; background: #fafbf9; }
  .status-done { font-size: .85rem; color: var(--muted); font-weight: 600; padding: 6px 10px; }
  .empty { color: var(--muted); text-align: center; padding: 24px; }

  /* 알림 & 설정 안내 */
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px;
    font-weight: 600; max-width: calc(100% - 32px); opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 10;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: var(--warn); }
  #toast.ok { background: var(--accent); }
  .setup {
    background: var(--warn-soft); border: 1px solid #f0c9bf; color: var(--warn);
    border-radius: var(--radius); padding: 16px; font-weight: 600;
  }

  /* 탭 */
  nav.tabs { background: var(--accent); }
  nav.tabs .inner { max-width: 1080px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; }
  nav.tabs button {
    border: none; border-radius: 10px 10px 0 0; background: transparent; color: #fff;
    opacity: .8; font-weight: 700; padding: 10px 20px;
  }
  nav.tabs button:hover { background: rgba(255, 255, 255, .12); opacity: 1; }
  nav.tabs button.active { background: var(--bg); color: var(--accent-ink); opacity: 1; }
  .tab-panel { display: grid; gap: 16px; }
  .tab-panel[hidden] { display: none; }
  .chart-box { position: relative; height: 300px; }
  .hint { font-size: .85rem; color: var(--muted); margin: 8px 0 0; }

  @media (max-width: 760px) {
    nav.tabs button { flex: 1; }
    .grid-form { grid-template-columns: 1fr 1fr; }
    .grid-form .wide-mobile { grid-column: 1 / -1; }
    .item { grid-template-columns: 1fr auto; gap: 4px 12px; }
    .item .game-name { grid-column: 1 / 2; }
    .item .who { grid-column: 1 / 2; }
    .item .time { grid-column: 1 / 2; }
    .item button, .item .status-done { grid-column: 2; grid-row: 1 / span 3; align-self: center; }
  }
</style>
</head>
<body>

<header>
  <div class="inner">
    <h1>🎲 우리 반 보드게임 대여소</h1>
    <p>재미있게 놀고 제자리에 정리한 뒤 꼭 반납 버튼을 눌러 주세요!</p>
  </div>
</header>

<nav class="tabs">
  <div class="inner">
    <button type="button" class="active" data-tab="rental">대여 · 반납</button>
    <button type="button" data-tab="stats">인기 순위 통계</button>
  </div>
</nav>

<main>
  <div id="setup" class="setup" hidden>
    index.html의 SUPABASE_URL, SUPABASE_KEY 값을 내 프로젝트 값으로 바꿔 주세요.
    (Supabase › Project Settings › API Keys 에서 Project URL과 publishable key를 복사)
  </div>

  <!-- ===================== 통계 탭 ===================== -->
  <div class="tab-panel" id="tab-stats" hidden>
    <section class="card">
      <div class="toolbar">
        <h2>🏆 우리 반 인기 보드게임 TOP</h2>
        <span class="spacer"></span>
        <button type="button" id="st-refresh">새로고침</button>
      </div>
      <p class="hint" style="margin-bottom: 14px;">누적 대여 횟수 기준입니다. (반납 완료된 기록 포함)</p>
      <div class="chart-box"><canvas id="ch-popular"></canvas></div>
    </section>
  </div>

  <!-- ===================== 대여·반납 탭 ===================== -->
  <div class="tab-panel" id="tab-rental">

    <!-- 1. 보드게임 현황판 -->
    <section class="card">
      <h2><span class="num">1</span>보드게임 현황 (클릭하면 바로 선택됩니다)</h2>
      <div class="game-grid" id="game-grid"></div>
    </section>

    <!-- 2. 보드게임 대여 등록 -->
    <section class="card" id="form-card">
      <h2><span class="num">2</span>보드게임 빌리기</h2>
      <form id="form" class="grid-form" autocomplete="off">
        <div class="wide-mobile">
          <label for="f-game">보드게임 선택 <span class="req">*</span></label>
          <select id="f-game" required></select>
        </div>
        <div>
          <label for="f-no">출석 번호 <span class="req">*</span></label>
          <input type="number" id="f-no" min="1" max="40" placeholder="예: 12" required>
        </div>
        <div>
          <label for="f-name">이름 <span class="req">*</span></label>
          <input type="text" id="f-name" maxlength="10" placeholder="예: 김민준" required>
        </div>
        <div class="wide-mobile">
          <label for="f-pin">반납용 비밀번호 (숫자 4자리) <span class="req">*</span></label>
          <input type="password" id="f-pin" inputmode="numeric" maxlength="4" pattern="[0-9]{4}"
            placeholder="반납할 때 필요해요" autocomplete="off" required>
        </div>
        <div class="full actions">
          <button type="submit" class="primary" id="f-submit">대여하기</button>
        </div>
      </form>
    </section>

    <!-- 3. 현재 대여 현황 및 반납 -->
    <section class="card">
      <div class="toolbar" style="margin-bottom: 10px;">
        <h2 style="margin:0;"><span class="num">3</span>대여 현황 · 반납하기</h2>
        <span class="spacer"></span>
        <label class="check"><input type="checkbox" id="s-returned"> 반납 완료된 기록도 보기</label>
      </div>
      <div class="list" id="list"></div>
    </section>

  </div>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script>
// =====================================================================
// ① 여기에 새로 만든 Supabase 프로젝트의 값을 붙여 넣으세요!
// =====================================================================
const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';
const SUPABASE_KEY = 'sb_publishable_YOUR-KEY';

let db = null;
let games = [];
let rentals = [];
let popularChart = null;

const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

let toastTimer;
function toast(msg, type = '') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show
